services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mhcp
    ports:
      - "5433:5432"
    volumes:
      - mhcp-postgres-data:/var/lib/postgresql/data

volumes:
  mhcp-postgres-data:
